name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Aggregate-consumer audit reads the immutable cutover commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tracked publication snapshot
        id: release-check
        shell: bash
        run: |
          set -o pipefail
          python -X utf8 verification/scripts/release_check.py 2>&1 | tee "$RUNNER_TEMP/release-check.log"
      - name: Annotate release gate errors
        if: failure()
        shell: bash
        run: |
          while IFS= read -r line; do
            case "$line" in
              "  ERR "*|"RELEASE-CHECK: FAIL"*)
                printf '::error file=verification/scripts/release_check.py::%s\n' "$line"
                ;;
            esac
          done < "$RUNNER_TEMP/release-check.log"
      - name: Parse website JavaScript
        run: node --check publish/website/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/website
      - id: deployment
        uses: actions/deploy-pages@v4
